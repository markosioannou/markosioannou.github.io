title: Markos Ioannou · Data & Analytics
url: https://markos-ioannou.com
description: Portfolio of Markos Ioannou, a Reconciliation Analyst with an MSc in Data Science and experience across financial data, analytics, machine learning, and bioinformatics.

defaults:
  - scope:
      path: "blog"
    values:
      sitemap: false

exclude:
  - node_modules
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .git
  - Gemfile
  - Gemfile.lock
  - package-lock.json
  - yarn.lock
  - blog_src

plugins:
  - jekyll-sitemap
