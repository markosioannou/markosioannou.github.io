name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  root-site-integrity:
    name: Root site integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required root-site files and local links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path.cwd()
          pages = (root / "index.html", root / "contact.html", root / "404.html")
          required = (*pages, root / "styles.css", root / "assets/images/profile.jpeg")
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]

          class LocalLinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in {"href", "src"} and value:
                          self.links.append(value)

          for page in pages:
              parser = LocalLinkParser()
              parser.feed(page.read_text(encoding="utf-8"))
              for link in parser.links:
                  parsed = urlparse(link)
                  if parsed.scheme or parsed.netloc or link.startswith(("#", "mailto:", "tel:", "data:")):
                      continue
                  target = root / parsed.path.lstrip("/")
                  if parsed.path and not target.is_file() and not target.is_dir():
                      missing.append(f"{page.name}: {link}")

          if missing:
              raise SystemExit("Missing required file or local link:\n- " + "\n- ".join(missing))
          PY

  blog-build:
    name: Blog build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog_src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blog_src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build blog
        run: npm run build
